<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Store - AboutPCGames</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5921279158711461" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #45f3ff;
            margin-bottom: 40px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .game-card {
            background-color: #1f2833;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            border: 1px solid #2f3b4c;
            transition: transform 0.2s;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #45f3ff;
        }

        /* Imaginea se va încadra complet fără să taie titlul */
        .game-card img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            border-radius: 6px;
            background-color: #0b0c10;
        }

        .game-card h3 {
    font-size: 1.1rem;
    margin-bottom: 8px;
    min-height: 44px; /* Forțează titlurile scurte să ocupe spațiu de 2 rânduri */
    display: flex;
    align-items: center;
    justify-content: center;
        }

        .game-card .edition {
            font-size: 14px;
            color: #c5c6c7;
            margin-bottom: 10px;
        }

        .game-card .price {
            font-size: 20px;
            font-weight: bold;
            color: #45f3ff;
            margin-bottom: 15px;
        }

        .buy-btn {
            background-color: #45f3ff;
            color: #0b0c10;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            width: 80%;
            transition: background 0.2s;
        }

        .buy-btn:hover {
            background-color: #1f2833;
            color: #45f3ff;
            border: 1px solid #45f3ff;
        }
    </style>
</head>
<body>

    <h1>PC Game Deals</h1>

<div class="games-grid">
    
    <!-- Game Card: The Mound: Omen of Cthulhu -->
    <div class="game-card">
        <img src="Game1.png.png" alt="The Mound: Omen of Cthulhu">
        <h3>The Mound: Omen of Cthulhu</h3>
        <div class="edition">Standard Edition</div>
        <div class="price">16.49 €</div>
        <a href="https://go.loaded.com/n4jKeo" target="_blank" class="buy-btn">Buy Now</a>
    </div>

    <!-- Game Card: Assassin's Creed: Black Flag Resynced -->
    <div class="game-card">
        <img src="game2.png.jpg" alt="Assassin's Creed: Black Flag Resynced">
        <h3>Assassin's Creed: Black Flag Resynced</h3>
        <div class="edition">Standard Edition</div>
        <div class="price">50.99 €</div>
        <a href="https://go.loaded.com/AgkO6o" target="_blank" class="buy-btn">Buy Now</a>
    </div>

    <!-- Game Card: Palworld -->
        <div class="game-card">
            <img src="game3.png.jpg" alt="Palworld">
            <h3>Palworld</h3>
            <div class="edition">Standard Edition</div>
            <div class="price">20.09 €</div>
            <a href="https://go.loaded.com/L0oLkM" target="_blank" class="buy-btn">Buy Now</a>
        </div>
    
    <!-- Game Card: Red Dead Redemption 2 -->
        <div class="game-card">
            <img src="game4.png" alt="Red Dead Redemption 2">
            <h3>Red Dead Redemption 2</h3>
            <div class="edition">Ultimate Edition</div>
            <div class="price">15.69 €</div>
            <a href="https://go.loaded.com/PzYQM6" target="_blank" class="buy-btn">Buy Now</a>
        </div>



</div>
</body>
</html>
