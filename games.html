<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magazin Jocuri - AboutPCGames</title>
    <style>
        /* Stiluri generale adaptate pentru Dark Mode */
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #45f3ff;
            margin-bottom: 40px;
        }

        /* Grila responsivă pe 4 coloane */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Design-ul unui card de joc */
        .game-card {
            background-color: #1f2833;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            border: 1px solid #2f3b4c;
            transition: transform 0.2s;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #45f3ff;
        }

        /* Stil pentru imaginea urcată */
        .game-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 6px;
            background-color: #0b0c10;
        }

        .game-card h3 {
            font-size: 18px;
            margin: 15px 0 5px 0;
            color: #ffffff;
        }

        .game-card .edition {
            font-size: 14px;
            color: #c5c6c7;
            margin-bottom: 10px;
        }

        .game-card .price {
            font-size: 20px;
            font-weight: bold;
            color: #45f3ff;
            margin-bottom: 15px;
        }

        /* Butonul de cumpărare (Link Afiliat) */
        .buy-btn {
            background-color: #45f3ff;
            color: #0b0c10;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            width: 80%;
            transition: background 0.2s;
        }

        .buy-btn:hover {
            background-color: #1f2833;
            color: #45f3ff;
            border: 1px solid #45f3ff;
        }
    </style>
</head>
<body>

    <h1>Oferte Jocuri PC</h1>

    <div class="games-grid">
        
        <!-- Card Joc: The Mound: Omen of Cthulhu -->
        <div class="game-card">
            <img src="Game1.png.png" alt="The Mound: Omen of Cthulhu">
            <h3>The Mound: Omen of Cthulhu</h3>
            <div class="edition">Standard Edition</div>
            <div class="price">16.49 €</div>
            <a href="https://loaded.gg/e/TheMound?p=aboutpcgames" target="_blank" class="buy-btn">Cumpără Acum</a>
        </div>

        <!-- Aici vei putea adăuga următoarele jocuri în viitor copiind structura de mai sus -->

    </div>

</body>
</html>
