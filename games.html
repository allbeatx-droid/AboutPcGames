<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy PC Games - AboutPCGames</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0c10;
            color: white;
            margin: 0;
            padding: 20px;
        }
        nav {
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #1f2833;
        }
        nav a {
            text-decoration: none;
            font-size: 16px;
        }
        h1 {
            text-align: center;
            margin-bottom: 40px;
        }
        /* Grid-ul care așează jocurile câte 4 pe linie */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        /* Cardul fiecărui joc */
        .game-card {
            background-color: #1f2833;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #45f3ff;
        }
        /* Spațiul pentru poza jocului */
        .game-card img {
            width: 100%;
            height: auto;
            border-radius: 6px;
            margin-bottom: 15px;
            background-color: #0b0c10;
        }
        .game-card h3 {
            font-size: 18px;
            margin: 10px 0 5px 0;
        }
        .game-card .edition {
            font-size: 14px;
            color: #c5c6c7;
            margin-bottom: 10px;
        }
        /* Stil pentru preț */
        .game-card .price {
            font-size: 20px;
            font-weight: bold;
            color: #45f3ff;
            margin-bottom: 15px;
        }
        /* Butonul de cumpărare */
        .btn {
            display: inline-block;
            background-color: #00ff88;
            color: #0b0c10;
            padding: 10px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #45f3ff;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" style="color: white; margin-right: 15px;">Home</a>
        <a href="games.html" style="color: #00ff88; font-weight: bold;">Buy PC Games</a>
    </nav>

    <h1>Recommended PC Games</h1>

    <div class="games-grid">
        
        <!-- JOCUL 1 -->
        <div class="game-card">
            <!-- Pune numele pozei tale aici după ce o urci pe GitHub, ex: "cthulhu.jpg" -->
            <img src="placeholder.jpg" alt="The Mound: Omen of Cthulhu">
            <h3>The Mound: Omen of Cthulhu</h3>
            <div class="edition">Deluxe Edition</div>
            <div class="price">19.99 €</div>
            <a href="https://go.loaded.com/n4jKeo" class="btn" target="_blank" rel="noopener noreferrer">Buy Now</a>
        </div>

    </div>

</body>
</html>
