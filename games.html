    <style>
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto 10px auto;
            padding: 0 15px;
        }

   .nav-link-home {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem; /* Font mult mai mic */
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
            border: 1px solid #2ecc71; /* Chenar mai subțire */
            padding: 5px 12px; /* Spațiere interioară redusă */
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .nav-link-home:hover {
            background-color: #2ecc71;
            color: #0b0c10;
        }
        .nav-link-home:hover {
            background-color: #2ecc71;
            color: #0b0c10;
        }

        h1 {
            text-align: center;
            color: #45f3ff;
            margin-bottom: 40px;
            margin-top: 10px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .game-card {
            background-color: #1f2833;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            border: 1px solid #2f3b4c;
            transition: transform 0.2s;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #45f3ff;
        }

        .game-card img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            border-radius: 6px;
            background-color: #0b0c10;
        }

        .game-card h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-card .edition {
            font-size: 14px;
            color: #c5c6c7;
            margin-bottom: 10px;
        }

        .game-card .price {
            font-size: 20px;
            font-weight: bold;
            color: #45f3ff;
            margin-bottom: 15px;
        }

        .buy-btn {
            background-color: #45f3ff;
            color: #0b0c10;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            width: 80%;
            transition: background 0.2s;
        }

        .buy-btn:hover {
            background-color: #1f2833;
            color: #45f3ff;
            border: 1px solid #45f3ff;
        }

        @media (max-width: 992px) {
            .games-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .games-grid {
                grid-template-columns: 1fr;
                justify-items: center;
                padding: 0 15px;
            }
            .game-card {
                width: 100%;
                max-width: 380px;
            }
        }
    </style>
</head>
<body>
